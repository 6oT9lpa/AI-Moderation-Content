      - '\b(?:чернокож\w*|темнокож\w*|африканц\w*|азиат\w*|цыган\w*|ромы|ромов|ромам|ромами|евре\w*|кавказц\w*|мигрант\w*|нацмен\w*|негр\w*|чурк\w*|хач\w*|жид\w*)\b'
      - '\b(?:black\s+people|white\s+people|black(?:s)?|white(?:s)?|asians?|africans?|jews?|gyps(?:y|ies)|immigrants?|migrants?)\b'
  gender:
    patterns:
      - '\b(?:женщин\w*|мужчин\w*|баб(?:а|ы|е|у|ой|ою|ами|ах)?|мужик\w*|девк\w*|девушк\w*|парн(?:и|ей|ям|ями|я)|феминист\w*)\b'
      - '\b(?:women|woman|men|man|females?|males?|girls?|boys?|feminists?)\b'
  family:
    patterns:
      - '\b(?:семь[яеиюёй]|семьи|семью|семей\w*|родн(?:я|и|ю)|родствен\w*|близк(?:ие|их|им|ими)|домочадц\w*)\b'
      - '\b(?:моих|твоих|своих|наших|ваших|его|её|их)\s+родных\b'
      - '\b(?:мам\w*|матер(?:и|ью)|мать|пап\w*|отц\w*|отец|родител\w*|брат(?:а|у|ом|е|ья|ьев|ьям|ьями|ьях|ск\w*|ств\w*)?|сестр\w*|сын\w*|доч(?:ь|ери|ерью)|дед\w*|бабушк\w*|дяд\w*|тет\w*|тёт\w*|жен[аеуы]|муж(?:а|у|ем|ья|ей)?)\b'
      - '\b(?:family|families|relatives?|kin|mother|mom|mum|father|dad|parents?|brothers?|sisters?|sons?|daughters?|grandmothers?|grandfathers?|wife|wives|husbands?)\b'

harm:
  degradation:
    patterns:
      - '\b(?:туп\w*|грязн\w*|мерзк\w*|ничтож\w*|урод\w*|дебил\w*|идиот\w*|ублюд\w*|мраз\w*|шлюх\w*|суч\w*|бляд\w*|долбо[её]б\w*|хуесос\w*|паразит\w*|животн\w*)\b'
      - '\b(?:не\s+люди|люди\s+второго\s+сорта|хуже\s+животных|место\s+на\s+кухне)\b'
      - '\b(?:stupid|dirty|inferior|vermin|animals?|parasites?|idiots?|retards?|bitches?|sluts?|whores?|scum|subhuman)\b'
  hate_action:
    patterns:
      - '\b(?:ненавиж\w*|презира\w*|уничтож\w*|истреб\w*|изгна\w*|выгна\w*|депортир\w*|запретить|стереть\s+с\s+лица)\b'
      - '\b(?:hate|exterminate|eradicate|deport|banish|expel|should\s+die|must\s+die)\b'
  threat:
    patterns:
      - '\b(?:убью|зарежу|сожгу|пристрелю|застрелю|изобью|покалечу|сломаю|взорву|изнасилую|повешу|утоплю)\b'
      - '\b(?:надо|нужно|следует|хочу|пора)\s+(?:убить|зарезать|сжечь|пристрелить|избить|покалечить|повесить|утопить)\b'
      - '\b(?:найду\s+(?:тво\w*|ваш\w*)|доберусь\s+до\s+(?:тво\w*|ваш\w*))\b'
      - '\b(?:(?:i|we)\s+(?:will|shall)|i''ll|we''ll|i''m\s+going\s+to|we''re\s+going\s+to)\s+(?:find\s+\w+\s+and\s+)?(?:kill|murder|stab|shoot|burn|beat|hurt|rape|hang|drown)\b'
      - '\b(?:find\s+your|come\s+for\s+your)\b'
  sexual:
    patterns:
      - '\b(?:изнасил\w*|трах\w*|выеб\w*|секс(?!изм)\w*|инцест\w*|совокуп\w*|минет\w*|анальн\w*\s+секс\w*)\b'
      - '\b(?:rape|raped|raping|sex|sexual|incest|intercourse|blowjob|anal\s+sex)\b'
  sexual_abuse:
    patterns:
      - '\b(?:изнасилую|изнасилуем|трахну|выебу)\b'
      - '\b(?:(?:i|we)\s+(?:will|shall)|i''ll|we''ll)\s+(?:rape|fuck)\b'
      - '\b(?:rape|fuck)\s+(?:your|his|her|their)\b'
  profanity:
    patterns:
      - '\b(?:хуй\w*|пизд\w*|ебан\w*|бляд\w*|долбо[её]б\w*|мудак\w*|гондон\w*|сука|сучк\w*)\b'
      - '\b(?:fuck|fucking|shit|bitch|asshole|cunt)\b'

counter_context:
