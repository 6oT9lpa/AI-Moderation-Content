services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ai-moder-rabbitmq-benchmark
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  moderation-worker:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq-worker
    image: ai-moder-rabbitmq-worker:local
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2F
      RABBITMQ_TASK_QUEUE: ai_moder.moderation.tasks
      RABBITMQ_RESULT_QUEUE: ai_moder.moderation.results
      RABBITMQ_WORKER_BATCH_SIZE: "32"
      RABBITMQ_WORKER_BATCH_TIMEOUT_MS: "50"
      RABBITMQ_WORKER_PREFETCH: "128"
      RABBITMQ_WORKER_SUBMIT_ACTION_RESULTS: "${RABBITMQ_WORKER_SUBMIT_ACTION_RESULTS:-true}"
      RABBITMQ_WORKER_METRICS_PATH: /out/worker_metrics.jsonl
      AI_MODERATOR_API_RUBERT_MODEL_DIR: /app/models/rubert-tiny2-moderation-trained
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./models:/app/models:ro
      - ./logs/rabbitmq-benchmark:/out

  autoscaler:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq-autoscaler
    image: ai-moder-rabbitmq-autoscaler:local
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    working_dir: /opt/ai-moder
    volumes:
      - .:/opt/ai-moder
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs/rabbitmq-benchmark:/out
    command:
      - --rabbitmq-api-url=http://guest:guest@127.0.0.1:15672
      - --queue=ai_moder.moderation.tasks
      - --compose-file=docker-compose.rabbitmq-benchmark.yml
      - --service=moderation-worker
      - --min-workers=${RABBITMQ_AUTOSCALER_MIN_WORKERS:-1}
      - --mid-workers=${RABBITMQ_AUTOSCALER_MID_WORKERS:-2}
      - --max-workers=${RABBITMQ_AUTOSCALER_MAX_WORKERS:-4}
      - --metrics-path=/out/worker_metrics.jsonl
      - --gpu-memory-scale-up-limit=${RABBITMQ_AUTOSCALER_GPU_MEMORY_LIMIT:-85}
      - --p95-scale-up-limit-ms=${RABBITMQ_AUTOSCALER_P95_LIMIT_MS:-5000}
      - --interval-seconds=${RABBITMQ_AUTOSCALER_INTERVAL_SECONDS:-5}

  rabbitmq-loadtest:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq-loadtest
    image: ai-moder-rabbitmq-loadtest:local
    network_mode: host
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs/rabbitmq-benchmark:/out
    command:
      - --rabbitmq-url=amqp://guest:guest@127.0.0.1:5672/%2F
      - --task-queue=ai_moder.moderation.tasks
      - --result-queue=ai_moder.moderation.results
      - --rps=${RABBITMQ_BENCHMARK_RPS:-20,50,100,200}
      - --duration-seconds=${RABBITMQ_BENCHMARK_DURATION_SECONDS:-60}
      - --warmup-seconds=${RABBITMQ_BENCHMARK_WARMUP_SECONDS:-120}
      - --warmup-rps=${RABBITMQ_BENCHMARK_WARMUP_RPS:-20}
      - --pause-seconds=${RABBITMQ_BENCHMARK_PAUSE_SECONDS:-30}
      - --repeats=${RABBITMQ_BENCHMARK_REPEATS:-3}
      - --channels=${RABBITMQ_BENCHMARK_CHANNELS:-200}
      - --users-per-rps=${RABBITMQ_BENCHMARK_USERS_PER_RPS:-12}
      - --result-timeout-seconds=${RABBITMQ_BENCHMARK_RESULT_TIMEOUT_SECONDS:-180}
      - --output=/out/rabbitmq_discord_bot_benchmark_summary.json
