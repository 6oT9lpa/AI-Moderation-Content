    - '\b(?:нельзя|недопустимо|не\s+следует|осуждаю|бороться\s+с|против\s+расизма|равные\s+права|не\s+все)\b'
    - '\bне\s+(?:урод\w*|туп\w*|грязн\w*|мерзк\w*|дебил\w*|идиот\w*|животн\w*)\b'
    - '\b(?:не\s+надо|нельзя|неправильно|не\s+стоит)\s+судить\b'
    - '\bсудить\s+всех\b'
    - '\b(?:утвержден\w*|фраз\w*|слов\w*|цитат\w*)\s+(?:о\s+том\s+)?(?:что\s+)?все\b'
    - '\b(?:claim|quote|statement)\s+(?:that\s+)?all\b'
    - '\b(?:do\s+not|don''t|must\s+not|should\s+not|condemn|against\s+racism|equal\s+rights|not\s+all)\b'
