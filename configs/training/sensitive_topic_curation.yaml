version: 1
proximity_chars: 96
harm_proximity_chars:
  degradation: 24
  hate_action: 64
  threat: 16
  sexual: 48
  sexual_abuse: 96
  profanity: 32

group_context:
  patterns:
    - '\b(?:все|эти|те|такие|любые|каждая|каждый|большинство|поголовно|всегда)\b'
    - '\b(?:all|these|those|every|most|always)\b'

topics:
