preprocessing:
  links:
    allowed_domains:
      - youtube.com
      - youtu.be
      - tiktok.com
      - vm.tiktok.com
    shortener_domains:
      - bit.ly
      - t.co
      - tinyurl.com
      - goo.gl
      - cutt.ly
      - is.gd
      - s.id
      - clck.ru
      - vk.cc
      - ow.ly
      - shorturl.at
      - rebrand.ly
    detect_any_url:
      enabled: true
      labels: [URL]
      severity: 1
      confidence: 0.55
      risk_weight: 10
      reason: url_detected
    shortener:
      enabled: true
      labels: [URL, SPAM]
      severity: 2
      confidence: 0.68
      risk_weight: 20
      reason: url_shortener_detected

  flood:
    messages_10s:
      enabled: true
      threshold: 4
      labels: [FLOOD]
      severity: 3
      confidence: 0.82
      risk_weight: 18
      reason: too_many_messages_in_10s
    messages_60s:
      enabled: true
      threshold: 8
      labels: [FLOOD]
      severity: 3
      confidence: 0.86
      risk_weight: 24
      reason: too_many_messages_in_60s
    repeated_messages_10m:
      enabled: true
      threshold: 4
      labels: [FLOOD]
      severity: 3
      confidence: 0.78
      risk_weight: 22
      reason: same_text_repeated_in_window

  spam:
    mass_mentions:
      enabled: true
      threshold: 5
      labels: [SPAM]
      severity: 2
      confidence: 0.74
      risk_weight: 25
      reason: mass_mentions_detected
    targeted_mass_mentions:
      enabled: true
      threshold: 3
      labels: [TOXIC]
      severity: 3
      confidence: 0.82
      risk_weight: 32
      reason: toxic_message_targets_multiple_users
    caps:
      enabled: true
      threshold: 0.65
      minimum_text_length: 8
      labels: [SPAM]
      severity: 1
      confidence: 0.58
      risk_weight: 10
      reason: caps_ratio_threshold_exceeded
    emoji:
      enabled: true
      threshold: 0.35
      minimum_text_length: 4
      labels: [SPAM]
      severity: 1
      confidence: 0.52
      risk_weight: 8
      reason: emoji_ratio_threshold_exceeded
    repeated_chars:
      enabled: true
      threshold: 0.4
      minimum_text_length: 6
      labels: [SPAM]
      severity: 1
      confidence: 0.56
      risk_weight: 10
      reason: repeated_char_score_threshold_exceeded
    repeated_words:
      enabled: true
      threshold: 5
      minimum_token_count: 5
      minimum_repetition_ratio: 0.5
      labels: [SPAM]
      severity: 2
      confidence: 0.72
      risk_weight: 20
      reason: repeated_word_threshold_exceeded

  invite:
    allowed_invite_codes: []
    detected:
      enabled: true
      labels: [INVITE]
      severity: 3
      confidence: 0.9
      risk_weight: 45
      reason: invite_like_pattern_detected

  evasion:
    unicode:
      enabled: true
      labels: [EVASION]
      severity: 2
      confidence: 0.64
      risk_weight: 20
      reason: mixed_or_suspicious_unicode_detected
